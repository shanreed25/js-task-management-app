<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management App</title>
    <script src="app.js" defer></script>
</head>

<body>
    <header>
        <h1>Task Management App</h1>
    </header>
    <main>
        <!-- need two sections add task section and tasks list section -->
         <!-- Input Fileds Needed:
            - Task name and deadline needs input tags
            - Category and Initial Status need select tags 
          -->
         <!-- Each input needs an id so app.js can find it with document.getElementById -->
        <section>
            <h2>Add a task</h2>

            <form id="task-form">
                <div class="form-container">

                    <div class="form-field">
                        <label for="task-name">Task</label>
                        <input id="task-name" type="text" required maxlength="200" placeholder="Update My Resume">
                        <span id="task-name-alert"></span>
                    </div>

                    <div class="form-field">
                        <label for="task-category">Category</label>
                        <select id="task-category">
                            <option value="" disabled selected hidden>Choose A Category</option>
                            <option value="Personal">Personal</option>
                            <option value="Work">Work</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <!-- <div class="form-field">
                        <label for="task-deadline">Deadline</label>
                        <input id="task-deadline" type="date">
                    </div>

                    <div class="form-field">
                        <label for="task-status">Initial status</label>
                        <select id="task-status">
                            <option id="task-status" value="Not Started">Not Started</option>
                            <option id="task-status" value="In Progesss">In Progress</option>
                            <option id="task-status" value="Waiting">Waiting</option>
                            <option id="task-status" value="Paused">Paused</option>
                            <option id="task-status" value="Done">Done</option>
                        </select>
                    </div> -->

                    <div>
                        <button type="button" id="add-task-button">Add Task</button>
                    </div>
                </div>
            </form>
        </section>

        <section>
            <h2>Tasks</h2>
            <ul id="task-list"></ul>
        </section>
    </main>
</body>

</html>
