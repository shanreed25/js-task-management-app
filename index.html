<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management App</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
    <!-- <script src="test.js"></script> -->
</head>

<body>
    <header>
        <h1>Task Management App</h1>
    </header>
    <main>
        <!-- need two sections add task section and tasks list section -->
         <!-- Input Fileds Needed:
            - Task name and deadline needs input tags
            - Category and Initial Status need select tags 
          -->
         <!-- Each input needs an id so app.js can find it with document.getElementById -->
        <section class="section-card">
            <h2>Add a task</h2>

            <form id="task-form">
                <div class="form-container">
                    <div class="form-field">
                        <label for="task-name">Task</label>
                        <input id="task-name" type="text" required maxlength="200" placeholder="Update My Resume">
                        <span id="task-name-alert"></span>
                    </div>

                    <div class="form-field">
                        <label for="task-category">Category</label>
                        <select id="task-category">
                            <option value="Other" class="other-category">Other</option>
                            <option value="Personal">Personal</option>
                            <option value="Work">Work</option>
                            
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="task-deadline">Deadline</label>
                        <input id="task-deadline" type="date">
                    </div>

                    <div class="form-field">
                        <label for="task-status">Status</label>
                        <select id="task-status">
                            <option value="Not Started">Not Started</option>
                            <option value="In Progess">In Progress</option>
                            <option value="Paused">Paused</option>
                            <option value="Done">Done</option>
                        </select>
                    </div>

                    <div>
                        <button type="button" id="add-task-button">Add Task</button>
                    </div>
                </div>
            </form>
        </section>

        <section id="task-list-section" class="section-card">
            <h2>Tasks</h2>
            <ul id="task-list"></ul>
            <p id="no-task-message">No Task To Complete! Have Task? Add Them Above</p>
        </section>
 
    </main>
</body>

</html>
