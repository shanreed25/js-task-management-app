<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js"></script>
</head>

<body>
    <main>
        <!-- need two sections add task section and tasks list section -->
        <section>
            <h2>Add a task</h2>
            <form id="task-form">
                <div>
                    <div>
                        <label for="task-name">Task name</label>
                        <input id="task-name" type="text" required maxlength="200" placeholder="Update My Resume">
                    </div>
                    <div>
                        <label for="task-category">Category</label>
                        <input id="task-category" type="text" list="category-options" maxlength="50" placeholder="Professional">
                    </div>
                    <div>
                        <label for="task-deadline">Deadline</label>
                        <input id="task-deadline" type="date">
                    </div>
                    <div>
                        <label for="task-status">Initial status</label>
                        <select id="task-status"></select>
                    </div>
                    <div>
                        <button type="submit" class="primary">Add Task</button>
                    </div>
                </div>
                <datalist id="category-options"></datalist>
            </form>
        </section>

        <section>
            <h2>Tasks</h2>
        </section>
    </main>
</body>

</html>
